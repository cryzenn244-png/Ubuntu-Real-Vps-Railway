[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/miracle/supervisord.pid
childlogdir=/run/miracle
loglevel=info

[unix_http_server]
file=/run/miracle/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/miracle/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:miracle-vnc]
command=/opt/miracle/scripts/start-vnc.sh
autostart=true
autorestart=unexpected
startsecs=3
startretries=5
priority=10
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:miracle-novnc]
command=/opt/miracle/scripts/start-novnc.sh
autostart=true
autorestart=unexpected
startsecs=2
startretries=5
priority=20
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:miracle-health]
command=/opt/miracle/scripts/start-health-server.sh
autostart=true
autorestart=unexpected
startsecs=1
priority=25
stopsignal=TERM
stopwaitsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:miracle-nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=unexpected
startsecs=2
startretries=5
priority=30
stopsignal=QUIT
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
